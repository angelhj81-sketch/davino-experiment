function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let responseBuffer = [];
let savedCount = 0;

async function flushResponses(force){
  if(responseBuffer.length===0) return;
  if(!force && responseBuffer.length < SAVE_BATCH) return;
  const batch = responseBuffer.splice(0, responseBuffer.length);
  let ok=false;
  for(let attempt=1; attempt<=3 && !ok; attempt++){
    try{
      const {error} = await sb.from('responses').insert(batch);
      if(!error){ ok=true; savedCount+=batch.length; slog(`saved ${savedCount}`); }
      else throw error;
    }catch(e){ await new Promise(r=>setTimeout(r, 800*attempt)); }
  }
  if(!ok){
    // 로컬 백업 (마지막 안전망)
    try{ const bak=JSON.parse(localStorage.getItem('dg_backup')||'[]'); bak.push(...batch);
      localStorage.setItem('dg_backup', JSON.stringify(bak)); slog('saved locally (offline)'); }
    catch(e){ responseBuffer.unshift(...batch); }  // 그래도 안되면 버퍼에 되돌림
  }
}

function queueResponse(row){ responseBuffer.push(row); flushResponses(false); }

function buildSequence(stimuli){
  const targets=stimuli.filter(s=>s.type==='Target'), distr=stimuli.filter(s=>s.type==='Distractor');
  let ordered=null;
  for(let att=0;att<300&&!ordered;att++){
    let pool=shuffle(targets),out=[],recent=[],ok=true;
    while(pool.length){
      let idx=pool.findIndex(x=>!recent.includes(x.audio_file));
      if(idx<0){ok=false;break;}
      out.push(pool.splice(idx,1)[0]);recent.push(out[out.length-1].audio_file);
      if(recent.length>MIN_LAG)recent.shift();
    }
    if(ok)ordered=out;
  }
  if(!ordered)ordered=shuffle(targets);
  const d=shuffle(distr),nSeg=d.length,base=Math.floor(ordered.length/nSeg),extra=ordered.length%nSeg;
  const sizes=Array(nSeg).fill(base);
  shuffle([...Array(nSeg).keys()]).slice(0,extra).forEach(i=>sizes[i]++);
  let seq=[],k=0;
  for(let i=0;i<nSeg;i++){seq=seq.concat(ordered.slice(k,k+sizes[i]));seq.push(d[i]);k+=sizes[i];}
  return seq;
}
function splitBlocks(seq,n){const per=Math.ceil(seq.length/n);const b=[];for(let i=0;i<n;i++)b.push(seq.slice(i*per,(i+1)*per));return b;}

function bindSurvey(){
  document.querySelectorAll('.opt[data-q]').forEach(el=>{

      const q=el.dataset.q;
      document.querySelectorAll('.opt[data-q="'+q+'"]').forEach(b=>b.classList.remove('sel'));

      }

      if(q==='abroad')document.getElementById('abroad-sub').classList.toggle('hidden',A.abroad!=='Yes');
      if(q==='otherlangs')document.getElementById('langs-sub').classList.toggle('hidden',A.otherlangs!=='Yes');
      if(q==='engmajor')document.getElementById('engmajor-sub').classList.toggle('hidden',A.engmajor!=='Yes');
      if(q==='engteacher')document.getElementById('engteacher-sub').classList.toggle('hidden',A.engteacher!=='Yes');
      // 영어시험 종류: None/기타가 아니면 점수 입력칸 표시
      if(q==='engtest'){
        const showScore = (A.engtest!=='None');
        document.getElementById('engscore-sub').classList.toggle('hidden', !showScore);
      }
    });
  });
  // 입력칸: 값이 바뀔 때마다 A에 저장 (화면이 사라진 뒤에도 값 유지)
  const textIds=['age','musicYears','engScore','abroadCountry','abroadMonths','origin','koreaDur','otherLangsText','majorName','majorYear','teacherDur'];
  textIds.forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',()=>{ A['_'+id]=el.value; });

// 설문 검증 + 판정 + 저장. 반환: {ok, eligible, reason}
// DOM 대신 A 객체만 읽음 (on_finish 시점엔 설문 화면이 이미 사라짐)
function processSurvey(){
  const ageV=A._age||'';
  const age=parseInt(ageV,10);
  if(!A.l1)return{ok:false,msg:"Please answer question 1 (first language)."};
  if(!ageV)return{ok:false,msg:"Please enter your age."};
  if(!A.gender)return{ok:false,msg:"Please select your gender."};
  if(!A.hearing)return{ok:false,msg:"Please answer question 2 (hearing)."};
  if(!A.music)return{ok:false,msg:"Please answer the musical training question."};
  if(A.l1==='Korean'){
    if(!A.engtest)return{ok:false,msg:"Please answer question 3 (English proficiency test)."};
    if(!A.abroad)return{ok:false,msg:"Please answer question 4 (living abroad)."};
    if(!A.engmajor)return{ok:false,msg:"Please answer question 5 (English-related major)."};
    if(!A.engteacher)return{ok:false,msg:"Please answer question 6 (English teaching)."};
  }
  if(A.l1==='English'){
    if(!(A._origin||'').trim())return{ok:false,msg:"Please enter your country of origin."};
    if(!A._koreaDur||!A.koreaUnit)return{ok:false,msg:"Please answer question 4 (time in Korea)."};
    if(!A.otherlangs)return{ok:false,msg:"Please answer question 5 (other languages)."};
  }
  // 판정 (종료 조건: 나이, 청력만. 영어성적은 종료 조건 아님)
  let reason=null;
  if(A.hearing==='Yes')reason='hearing';
  else if(isNaN(age)||age<20||age>39)reason='age';
  const eligible=(reason===null);
  let koreaMonths=null;
  if(A.l1==='English'){const d=parseFloat(A._koreaDur);koreaMonths=(A.koreaUnit==='years')?d*12:d;}
  participantCode=makeCode();
  const row={
    session_id:sessionId, participant_id:participantCode, consent:true,
    age:age, gender:A.gender, l1:A.l1,
    hearing_impair:A.hearing==='Yes', music_training:A.music==='Yes',
    music_years:A.music==='Yes'?parseFloat(A._musicYears)||null:null,
    eng_test_type:A.l1==='Korean'?(A.engtest||null):null,
    eng_test_score:(A.l1==='Korean'&&A.engtest&&A.engtest!=='None')?(A._engScore||'').trim()||null:null,
    eng_major:A.l1==='Korean'?(A.engmajor==='Yes'):null,
    eng_major_name:(A.l1==='Korean'&&A.engmajor==='Yes')?(A._majorName||'').trim()||null:null,
    eng_major_year:(A.l1==='Korean'&&A.engmajor==='Yes'&&A._majorYear)?parseInt(A._majorYear,10):null,
    eng_teacher:A.l1==='Korean'?(A.engteacher==='Yes'):null,
    eng_teacher_years:(A.l1==='Korean'&&A.engteacher==='Yes'&&A._teacherDur)?parseFloat(A._teacherDur):null,
    lived_abroad:A.l1==='Korean'?(A.abroad==='Yes'):null,
    abroad_country:A.abroad==='Yes'?(A._abroadCountry||'').trim()||null:null,
    abroad_months:A.abroad==='Yes'?parseFloat(A._abroadMonths)||null:null,
    origin_country:A.l1==='English'?(A._origin||'').trim():null,
    korea_months:koreaMonths,
    other_langs:A.l1==='English'?(A.otherlangs==='Yes'):null,
    other_langs_text:A.otherlangs==='Yes'?(A._otherLangsText||'').trim()||null:null,
    eligible:eligible, exclusion_reason:reason,
    user_agent:navigator.userAgent, screen_w:screen.width, screen_h:screen.height
  };
  // 저장은 백그라운드 (화면 전환을 막지 않음). 실패해도 재시도.
  saveSubject(row);
  return{ok:true, eligible, reason};
}

// subjects 저장 — 재시도 + 로컬 백업
async function saveSubject(row){
  for(let attempt=1; attempt<=3; attempt++){
    try{ const {error}=await sb.from('subjects').insert(row); if(!error){subjectSaved=true; slog('subject saved'); return;} else throw error; }
    catch(e){ await new Promise(r=>setTimeout(r,800*attempt)); }
  }
  try{ localStorage.setItem('dg_subject_backup', JSON.stringify(row)); slog('subject saved locally'); }catch(e){}
}

// subjectSaved가 될 때까지 잠깐 기다리는 헬퍼 (설문 insert가 백그라운드라 시점이 어긋날 수 있음)
async function waitForSubject(maxMs){
  const start=Date.now();
  while(!subjectSaved && Date.now()-start<maxMs){ await new Promise(r=>setTimeout(r,300)); }
  return subjectSaved;
}

// 헤드폰 체크 점수를 이미 저장된 subjects 행에 업데이트 (참고용 기록)
async function saveHpScore(){
  if(hpScore===null) return;
  await waitForSubject(8000);   // 설문 저장이 끝나길 기다림
  for(let attempt=1; attempt<=4; attempt++){
    try{
      const {error}=await sb.from('subjects')
        .update({ headphone_score: hpScore, headphone_pass: hpScore>=HP_PASS })
        .eq('session_id', sessionId);
      if(!error){ slog('hp saved: '+hpScore); return; }
      else { slog('hp save err: '+(error.message||error.code||'?')); throw error; }
    }catch(e){ await new Promise(r=>setTimeout(r,700*attempt)); }
  }
  slog('hp save FAILED');
}

// 영어 변별 과제 점수를 subjects 행에 업데이트 (참고용 기록)
async function saveProfScore(){
  if(profTaskScore===null) return;
  await waitForSubject(8000);
  for(let attempt=1; attempt<=4; attempt++){
    try{
      const {error}=await sb.from('subjects')
        .update({ prof_task_score: profTaskScore, prof_target: profTargetScore, prof_stq: profStqScore })
        .eq('session_id', sessionId);
      if(!error){ slog('prof saved: '+profTaskScore); return; }
      else { slog('prof save err: '+(error.message||error.code||'?')); throw error; }
    }catch(e){ await new Promise(r=>setTimeout(r,700*attempt)); }
  }
  slog('prof save FAILED');
}

// 영어 변별 과제 블록 생성 (문항 순서 랜덤화, 각 문항의 개별 응답도 responses에 기록)
function makeEngTaskBlock(){
  const tl=[];
  const items=shuffle(ENG_TASK);
  const score={correct:0, target_dz:0, stq:0};
  const total=items.length;
  items.forEach((it,i)=>{
    const isLast=(i===total-1);
    tl.push({
      type:jsPsychHtmlButtonResponse,
      // 한 화면: 강조 단어(상단) + Audio A/B 재생 버튼 + A/B 선택 버튼
      stimulus:`<div class="instr" style="text-align:center">
        <div class="listen-label">Question ${i+1} / ${total}</div>
        <div class="prof-word" style="font-size:34px;font-weight:700;margin:20px 0 6px;letter-spacing:1px">${it.prompt}</div>
        <p style="color:var(--muted);margin-top:0">Think of the sound the <b>bold / underlined</b> letters make,<br>then find which audio contains that same sound.</p>
        <div style="display:flex;gap:16px;justify-content:center;margin:26px 0 8px">
          <button type="button" id="playA" class="audio-play-btn">▶ Audio A</button>
          <button type="button" id="playB" class="audio-play-btn">▶ Audio B</button>
        </div>
        <p style="color:var(--muted);font-size:14px">You can replay each sound as many times as you like.</p>
        <p style="margin-top:22px;font-weight:600">Which one has the same sound? ↓</p>
      </div>`,
      choices:["A", "B"],
      data:{phase:"prof_task", item_id:it.id, item_type:it.type, correct_answer:it.answer},
      on_load:()=>{
        // 오디오 요소 두 개를 만들어 버튼에 연결 (자유 재생)
        const aA=new Audio(ENG_BASE+it.a1), aB=new Audio(ENG_BASE+it.a2);
        const bA=document.getElementById('playA'), bB=document.getElementById('playB');
        if(bA)bA.addEventListener('click',()=>{ aB.pause(); aB.currentTime=0; aA.currentTime=0; aA.play(); bA.classList.add('playing-btn'); setTimeout(()=>bA.classList.remove('playing-btn'),700); });
        if(bB)bB.addEventListener('click',()=>{ aA.pause(); aA.currentTime=0; aB.currentTime=0; aB.play(); bB.classList.add('playing-btn'); setTimeout(()=>bB.classList.remove('playing-btn'),700); });
      },
      on_finish:(d)=>{
        const chosen=d.response+1;   // 0,1 → A(1),B(2)
        d.chosen=chosen;
        d.is_correct=(chosen===it.answer);
        // 유형별 정답 집계 (z/dʒ 와 s/tʃ 를 따로 셈). responses에는 저장하지 않음(점수만 필요).
        if(d.is_correct){
          score.correct++;
          if(it.type==='target_dz') score.target_dz++;
          else if(it.type==='filler_stq') score.stq++;
        }
        // 마지막 문항이 끝나면 총점 저장 (여기서 저장해야 확실히 실행됨)
        if(isLast){
          profTaskScore=score.correct;
          profTargetScore=score.target_dz;   // z/dʒ 정답 수 (0~6)
          profStqScore=score.stq;            // s/tʃ 정답 수 (0~6)
          saveProfScore();
        }
      }
    });
  });
  return {tl, score};
}

const HP_SET_NAMES=["HugginsPitch_set1_","HugginsPitch_set2_","HugginsPitch_set3_","HugginsPitch_set4_","HugginsPitch_set5_","HugginsPitch_set6_"];
function makeHPBlock(attemptNum, scoreObj){
  const tl=[];
  const sets=shuffle(HP_SET_NAMES).map(name=>({file:name,answer:randInterval()}));
  sets.forEach((s,i)=>{
    // 문항 시작 신호 (짧게 표시 후 자동 진행) — 캘리브레이션/이전 소리와 확실히 구분
    tl.push({type:jsPsychHtmlButtonResponse,
      stimulus:`<div class="instr" style="text-align:center">
        <div class="qtext" style="margin-bottom:12px">문제 ${i+1} / 6 · Question ${i+1} of 6</div>
        <p style="color:var(--muted)">준비되면 시작하세요. 잡음이 <b>3번</b> 이어서 재생됩니다.<br>Press start. You'll hear <b>3</b> noises in a row.</p></div>`,
      choices:["소리 듣기 / Play"], });
    // 3구간 잡음 재생
    tl.push({type:jsPsychAudioButtonResponse, stimulus:HP_BASE+s.file+s.answer+".wav",
      prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div>
        <div class="qtext">문제 ${i+1} / 6</div>
        <p style="color:var(--muted)">세 잡음 중 어디에 삐— 소리가 숨어 있는지 집중하세요.<br>Listen for the faint tone across the three noises…</p></div>`,
      choices:[], trial_ends_after_audio:true, response_allowed_while_playing:false});
    tl.push({type:jsPsychHtmlButtonResponse,
      stimulus:`<div class="qtext">삐— 소리가 숨어 있던 잡음은 몇 번째였나요?</div><p style="color:var(--muted)">Which noise had the faint tone hidden inside — 1st, 2nd, or 3rd?</p>`,
      choices:["첫 번째<br><span style='font-size:13px;color:#6b7280'>1st</span>","두 번째<br><span style='font-size:13px;color:#6b7280'>2nd</span>","세 번째<br><span style='font-size:13px;color:#6b7280'>3rd</span>"],
      on_finish:(d)=>{ if((d.response+1)===s.answer)scoreObj.correct++; }});
  });
  return tl;
}

async function main(){
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // 창을 갑자기 닫을 때 남은 응답을 localStorage에 백업 (최후 안전망)
  window.addEventListener('beforeunload', function(){
    if(responseBuffer.length>0){
      try{
        const bak=JSON.parse(localStorage.getItem('dg_backup')||'[]');
        bak.push(...responseBuffer);
        localStorage.setItem('dg_backup', JSON.stringify(bak));
      }catch(e){}
    }
  });

  const jsPsych=initJsPsych({
    on_finish: async ()=>{ await flushResponses(true); }
  });
  const timeline=[];

  // --- 0. 모바일 안내 (막고 종료) ---
  if(isMobile){

  }

  // --- preload: 헤드폰 검사음 전체 + 실험 음원 ---

  let seq = buildSequence(stimuli);

  if(QUICK_TEST) blocks = blocks.map(b=>b.slice(0,QUICK_PER_BLOCK));

  const hpAudio=[]; HP_SET_NAMES.forEach(n=>{for(let v=1;v<=3;v++)hpAudio.push(HP_BASE+n+v+".wav");});
  hpAudio.push(HP_BASE+"HugginsPitch_calibration.wav");
  const mainAudio=[...new Set(blocks.flat().map(s=>AUDIO_BASE+s.audio_file))];
  const practiceAudio=PRACTICE.map(p=>AUDIO_BASE+p.audio);
  const engAudio=[]; ENG_TASK.forEach(it=>{ engAudio.push(ENG_BASE+it.a1); engAudio.push(ENG_BASE+it.a2); });

  timeline.push({type:jsPsychPreload, audio:[...hpAudio, ...engAudio, ...practiceAudio, ...mainAudio],
    message:"<p style='color:#6b7280'>Loading… 잠시만 기다려 주세요.</p>", max_load_time:60000,
    error_message:"<p>일부 파일을 불러오지 못했습니다. 새로고침 해주세요.<br>Some files failed to load. Please refresh.</p>"});

  // --- 1. 동의서 ---
  timeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div><h2 style="text-align:center;color:var(--accent)">Speech Perception Experiment</h2>
      <div class="consent-body">
        <p><em>[ IRB 승인 동의서 전문을 여기에 넣으세요. 아래는 자리표시용입니다. ]</em></p>
        <p>You are invited to take part in a research study on speech perception. Participation is voluntary; you may stop anytime without penalty. The study takes about 40–60 minutes and involves listening to short audio clips and choosing between two options.</p>
        <p>Your responses are recorded anonymously. No personally identifying information is collected.</p>
      </div>
      <p style="text-align:center">By clicking below, you confirm that you have read and understood the above and agree to participate.</p></div>`,
    choices:["I agree — continue"]});

  // --- 2. 설문 (검증 실패 시 같은 화면 유지) ---
  const surveyNode={type:jsPsychHtmlButtonResponse, stimulus:surveyHTML, choices:["Submit"],
    on_load:bindSurvey,
    on_finish:(data)=>{
      const res=processSurvey();
      data.survey_ok=res.ok; data.eligible=res.eligible; data.reason=res.reason; data.msg=res.msg;
    }};
  const surveyLoop={timeline:[surveyNode],
    loop_function:(d)=>{ const last=d.values()[d.values().length-1];
      if(!last.survey_ok){ setTimeout(()=>{const e=document.getElementById('surveyErr');if(e)e.textContent=last.msg;},50); return true; }
      return false; }};
  timeline.push(surveyLoop);

  // --- 3. 자격 미달 종료 (조건부) ---
  let excluded=false;
  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Thank you for your interest</h2>
      <p>Based on your responses, you do not meet the participation criteria for this study.</p>
      <p style="color:var(--muted)">You may now close this window. We appreciate your time.</p></div>`,
    choices:[]}],
    conditional_function:()=>{ const d=jsPsych.data.get().filter({trial_type:'html-button-response'}).values();
      const s=d.reverse().find(x=>x.eligible!==undefined); excluded=(s && s.eligible===false); return excluded; }});

  // 이후 노드는 자격 통과자만 (excluded면 실험 종료 상태)
  const notExcluded=()=>!excluded;

  // --- 4. 헤드폰 체크 (통과/탈락 없음 — 안내 후 1회 실시, 점수만 기록하고 항상 통과) ---
  const hpResult={correct:0};

  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>헤드폰 확인 / Headphone check</h2>
      <p>이 실험은 <b>헤드폰이나 이어폰</b> 착용을 권장합니다. / We recommend wearing <b>headphones</b> for this study.</p>
      <p>다음 6개 문제에서, 잡음(쉬이익)이 <b>3번</b> 연달아 재생됩니다. 셋 다 크기는 같지만 <b>하나에만</b> 희미한 삐— 소리가 숨어 있습니다. 그게 몇 번째인지 골라 주세요.<br>
      <span style="color:var(--muted)">You'll hear noise 3 times; all same loudness, but only one hides a faint tone. Pick which one.</span></p>

    choices:["시작 / Start"]}], conditional_function:notExcluded});

  timeline.push({type:jsPsychAudioButtonResponse, stimulus:HP_BASE+"HugginsPitch_calibration.wav",
    prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div>
      <div class="qtext" style="margin-bottom:10px">볼륨 조절 / Volume check</div>
      <p style="color:var(--muted)">이 소리는 <b>볼륨 조절용</b>입니다. 편안한 크기로 맞춘 뒤 계속하세요.<br>This is only for setting your volume. Adjust it, then continue.</p></div>`,
    choices:["볼륨을 맞췄습니다 / Volume is set"], response_allowed_while_playing:true,
    conditional_function:notExcluded} );

  // 캘리브레이션과 본 검사 사이 명확한 구분 (노이즈 혼동 방지)
  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr" style="text-align:center"><h2>이제 검사를 시작합니다 / Test begins now</h2>
      <p>볼륨 조절이 끝났습니다. 지금부터 <b>6개의 문제</b>가 나옵니다.</p>
      <p>각 문제에서 잡음이 <b>3번</b> 이어서 재생됩니다. 그중 <b>하나에만</b> 희미한 삐— 소리가 숨어 있으니, 몇 번째인지 고르세요.<br>
      <span style="color:var(--muted)">Volume is set. Now 6 questions follow. In each, you'll hear 3 noises; only one hides a faint tone. Pick which one (1st, 2nd, 3rd).</span></p></div>`,
    choices:["첫 문제 시작 / Start question 1"]}], conditional_function:notExcluded});

  // 검사 1회 실시 — 결과와 무관하게 다음으로 진행
  timeline.push({timeline:makeHPBlock(1,hpResult), conditional_function:notExcluded});

  // 완료 안내 (통과/탈락 문구 없음, 항상 같은 다음 단계로)
  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>확인 완료 / Check complete</h2>
      <p>헤드폰 확인이 끝났습니다. 실험으로 넘어갑니다.<br><span style="color:var(--muted)">Headphone check complete. Proceeding to the experiment.</span></p></div>`,
    choices:["계속 / Continue"],
    on_finish:()=>{ hpScore=hpResult.correct; saveHpScore(); }}], conditional_function:notExcluded});

  // --- 소리 맞추기 과제는 본 실험 종료 후 실시 (자격 통과자 전원, 아래 mainTimeline 끝부분에 배치) ---

  // 헤드폰 결과와 무관하게 자격 통과자는 모두 본 실험으로 진행
  const canProceed=()=>notExcluded();

  // --- 5~8: 지시 → 연습 → 본실험 → 완료 를 하나의 conditional timeline으로 묶음 ---
  const mainTimeline=[];

  // 5. 지시문
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Instructions</h2><ul>
      <li><b>Environment.</b> Wear headphones and stay in a quiet room.</li>
      <li><b>Volume.</b> You'll set your volume during the practice trials. Once the main session starts, keep it unchanged.</li>
      <li><b>Audio.</b> Each clip plays <b>only once</b>. You cannot replay or pause it.</li>
      <li><b>Response.</b> Respond as quickly as possible based on your first impression. There are no right or wrong answers.</li>
      <li><b>Duration &amp; breaks.</b> About 740 trials (40–60 min), with three short self-paced breaks.</li>
      </ul><p style="text-align:center">First, let's set your volume and do a few practice trials.</p></div>`,
    choices:["Next / 다음"]});

  // 5-b. 볼륨 재조정 안내 (헤드폰 체크와 본 실험은 적정 음량이 다름)
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Adjust your volume</h2>
      <p>The headphone test may have required a higher volume. From now on, you'll be listening to <b>speech</b>.</p>
      <p>Use the practice sounds that follow to set a <b>comfortable and clear</b> level for the voice. Once you've set it, please keep it unchanged throughout the main experiment.</p></div>`,
    choices:["Start practice"]});

  // 6. 연습 (저장 안 함)
  PRACTICE.forEach((p,pi)=>{
    let left, right;
    if(p.correct===null){ left=p.opt1; right=p.opt2; }  // Target: 고정
    else{ const swap=Math.random()<0.5; left=swap?p.opt2:p.opt1; right=swap?p.opt1:p.opt2; }  // distractor: 랜덤
    mainTimeline.push(
      {type:jsPsychAudioButtonResponse, stimulus:AUDIO_BASE+p.audio,
        prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div><div class="listen-label">Practice ${pi+1}/${PRACTICE.length} · Listen…</div></div>`,
        choices:[], trial_ends_after_audio:true, response_allowed_while_playing:false},
      {type:jsPsychHtmlButtonResponse, stimulus:`<div class="qtext">${p.question}</div>`, choices:[left,right]}
    );
  });
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Practice complete</h2>
      <p>The real experiment begins now. Each sound plays <b>only once</b>, so respond based on your first impression.</p>
      <p><b>Please keep your volume as it is now.</b></p></div>`,
    choices:["Begin the experiment"]});

  // 7. 본 실험
  const totalTrials=blocks.flat().length;
  let gIdx=0;
  blocks.forEach((block,bi)=>{
    block.forEach(stim=>{
      gIdx++; const gi=gIdx;
      // Target: 좌우 고정 (opt1=Davino 왼쪽, opt2=Gavino 오른쪽). Distractor: 좌우 랜덤.
      let left, right;
      if(stim.type==='Target'){
        left=stim.opt1; right=stim.opt2;
      }else{
        const swap=Math.random()<0.5; left=swap?stim.opt2:stim.opt1; right=swap?stim.opt1:stim.opt2;
      }
      mainTimeline.push(
        {type:jsPsychAudioButtonResponse, stimulus:AUDIO_BASE+stim.audio_file,
          prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div><div class="listen-label">Listen…</div></div>`,
          choices:[], trial_ends_after_audio:true, response_allowed_while_playing:false},
        {type:jsPsychHtmlButtonResponse, stimulus:`<div class="qtext">${stim.question}</div>`, choices:[left,right],
          on_finish:(d)=>{
            const word=(d.response===0)?left:right;
            queueResponse({ session_id:sessionId, trial_index:gi, block:bi+1,
              item_id:stim.item_id, type:stim.type, context_type:stim.context_type,
              context_word:stim.context_word, place:stim.place, voicing:stim.voicing,
              step:stim.step, repetition:stim.repetition, audio_file:stim.audio_file,
              option_left:left, option_right:right, response:word,
              correct_answer:stim.correct, is_correct:(stim.correct===null)?null:(word===stim.correct), rt:d.rt });
          }}
      );
    });
    if(bi<blocks.length-1){
      mainTimeline.push({type:jsPsychHtmlButtonResponse,
        stimulus:()=>`<div class="instr" style="text-align:center"><h2>Break ${bi+1} of ${N_BLOCKS-1}</h2>
          <p>You've completed block ${bi+1} of ${N_BLOCKS}.</p>
          <p style="color:var(--muted)">Take a short rest. Continue when ready.</p>
          <div class="progress-bar"><div style="width:${Math.round(gIdx/totalTrials*100)}%"></div></div>
          <p style="color:var(--muted);font-size:14px">${gIdx} / ${totalTrials}</p></div>`,
        choices:["Continue"], on_load:()=>flushResponses(true)});
    }
  });

  // --- 소리 맞추기 과제 (본 실험 종료 후, 자격 통과자 전원, 점수만 기록) ---
  const engAnnounce={type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>One last task</h2>
      <p>The main experiment is complete. Before you finish, here is a short <b>sound-matching task</b> (${ENG_TASK.length} questions).</p>
      <p>A word will appear at the top with part of it in <b>bold and underlined</b>. Think of the sound those letters make. Then play <b>Audio A</b> and <b>Audio B</b> — as many times as you like — and choose the one that contains the <b>same sound</b>.</p></div>`,
    choices:["Start"],
    on_load:()=>flushResponses(true)};  // 영어 과제 전에 본 실험 응답을 모두 저장
  // 안내 + 문항들을 하나의 timeline으로 묶음 (본 실험까지 온 참가자 전원)
  mainTimeline.push({timeline:[engAnnounce, ...engBlock.tl]});

  // 8. 저장 완료 대기 화면 (마지막 배치가 확실히 저장될 때까지 기다림 — 데이터 누락 방지)
  //    저장이 끝나면 버튼이 활성화됨. jsPsych.finishTrial() 대신 버튼 방식이라 타이밍이 안정적.
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr" style="text-align:center"><h2>Saving your responses…</h2>
      <p>응답을 저장하고 있습니다. 잠시만 기다려 주세요.<br>
      <span style="color:var(--muted)">Please wait a moment while we save your responses.</span></p>
      <p id="saveStatus" style="color:var(--muted);font-size:14px">저장 중… / Saving…</p></div>`,
    choices:["계속 / Continue"],
    on_load: function(){
      // "계속" 버튼을 처음엔 숨김 → 저장이 다 끝나면 보여줌
      const btnWrap=document.querySelector('#jspsych-html-button-response-btngroup');
      if(btnWrap) btnWrap.style.visibility='hidden';
      (async function(){
        const start=Date.now();
        // 남은 응답을 모두 저장할 때까지 반복 (최대 20초)
        while(responseBuffer.length>0 && Date.now()-start<20000){
          await flushResponses(true);
          if(responseBuffer.length>0) await new Promise(r=>setTimeout(r,500));
        }
        slog('final flush done, remaining: '+responseBuffer.length);
        // 저장 완료 표시 + 버튼 보이기
        const st=document.getElementById('saveStatus');
        if(st){ st.textContent='저장 완료 · Saved ✓'; st.style.color='var(--ok)'; }
        if(btnWrap) btnWrap.style.visibility='visible';
      })();
    }
  });

  // 9. 완료 코드
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:()=>`<div class="instr" style="text-align:center"><h2>All done — thank you! 🎧</h2>
      <p>실험을 모두 마쳤습니다. 보상을 받으려면 아래 <b>완료 코드</b>를 폼에 제출해 주세요.<br>
      <span style="color:var(--muted)">You've completed the experiment. To receive your reward, submit the code below.</span></p>
      <div class="code-box">${participantCode}</div>
      <p><b>제출 방법 / How to submit:</b><br>
      아래 링크를 열어 이 코드를 입력하세요. / Open the link below and enter this code:</p>
      <p><a href="${REWARD_FORM_URL}" target="_blank" style="color:var(--accent);font-weight:600;font-size:17px">▶ 보상 신청 폼 열기 / Open reward form</a></p>
      <p style="color:var(--muted);font-size:13px">코드를 복사해 두세요. 이 창을 닫으면 다시 볼 수 없습니다.<br>Please copy your code — it won't be shown again after you close this window.</p></div>`,
    choices:["완료 / Finish"], on_load:()=>flushResponses(true)});

  // 전체를 하나의 conditional timeline으로 (자격통과 + 헤드폰통과자만)
  timeline.push({ timeline:mainTimeline, conditional_function:canProceed });

  jsPsych.run(timeline);
}

// 새로고침/이탈 경고
window.addEventListener('beforeunload',(e)=>{ if(subjectSaved && savedCount>=0){ e.preventDefault(); e.returnValue=''; } });

main().catch(e=>{ document.body.innerHTML='<p style="padding:40px;font-family:sans-serif">오류가 발생했습니다. 새로고침 해주세요.<br>An error occurred. Please refresh.<br><small>'+e.message+'</small></p>'; });
</script>
</body>
</html>
