function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let responseBuffer = [];
let savedCount = 0;

async function flushResponses(force){
  if(responseBuffer.length===0) return;
  if(!force && responseBuffer.length < SAVE_BATCH) return;
  const batch = responseBuffer.splice(0, responseBuffer.length);
  let ok=false;
  for(let attempt=1; attempt<=3 && !ok; attempt++){
    try{
      const {error} = await sb.from('responses').insert(batch);
      if(!error){ ok=true; savedCount+=batch.length; slog(`saved ${savedCount}`); }
      else throw error;
    }catch(e){ await new Promise(r=>setTimeout(r, 800*attempt)); }
  }
  if(!ok){
    // 로컬 백업 (마지막 안전망)
    try{ const bak=JSON.parse(localStorage.getItem('dg_backup')||'[]'); bak.push(...batch);
      localStorage.setItem('dg_backup', JSON.stringify(bak)); slog('saved locally (offline)'); }
    catch(e){ responseBuffer.unshift(...batch); }  // 그래도 안되면 버퍼에 되돌림
  }
}

function queueResponse(row){ responseBuffer.push(row); flushResponses(false); }

function buildSequence(stimuli){
  const targets=stimuli.filter(s=>s.type==='Target'), distr=stimuli.filter(s=>s.type==='Distractor');
  let ordered=null;
  for(let att=0;att<300&&!ordered;att++){
    let pool=shuffle(targets),out=[],recent=[],ok=true;
    while(pool.length){
      let idx=pool.findIndex(x=>!recent.includes(x.audio_file));
      if(idx<0){ok=false;break;}
      out.push(pool.splice(idx,1)[0]);recent.push(out[out.length-1].audio_file);
      if(recent.length>MIN_LAG)recent.shift();
    }
    if(ok)ordered=out;
  }
  if(!ordered)ordered=shuffle(targets);
  const d=shuffle(distr),nSeg=d.length,base=Math.floor(ordered.length/nSeg),extra=ordered.length%nSeg;
  const sizes=Array(nSeg).fill(base);
  shuffle([...Array(nSeg).keys()]).slice(0,extra).forEach(i=>sizes[i]++);
  let seq=[],k=0;
  for(let i=0;i<nSeg;i++){seq=seq.concat(ordered.slice(k,k+sizes[i]));seq.push(d[i]);k+=sizes[i];}
  return seq;
}
function splitBlocks(seq,n){const per=Math.ceil(seq.length/n);const b=[];for(let i=0;i<n;i++)b.push(seq.slice(i*per,(i+1)*per));return b;}

function bindSurvey(){
  document.querySelectorAll('.opt[data-q]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const q=el.dataset.q;
      document.querySelectorAll('.opt[data-q="'+q+'"]').forEach(b=>b.classList.remove('sel'));

      }

      if(q==='abroad')document.getElementById('abroad-sub').classList.toggle('hidden',A.abroad!=='Yes');
      if(q==='otherlangs')document.getElementById('langs-sub').classList.toggle('hidden',A.otherlangs!=='Yes');
      if(q==='engmajor')document.getElementById('engmajor-sub').classList.toggle('hidden',A.engmajor!=='Yes');
      if(q==='engteacher')document.getElementById('engteacher-sub').classList.toggle('hidden',A.engteacher!=='Yes');
      // 영어시험 종류: None/기타가 아니면 점수 입력칸 표시
      if(q==='engtest'){
        const showScore = (A.engtest!=='None');
        document.getElementById('engscore-sub').classList.toggle('hidden', !showScore);
      }
    });
  });
  // 입력칸: 값이 바뀔 때마다 A에 저장 (화면이 사라진 뒤에도 값 유지)
  const textIds=['age','musicYears','engScore','abroadCountry','abroadMonths','origin','koreaDur','otherLangsText','majorName','majorYear','teacherDur'];
  textIds.forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',()=>{ A['_'+id]=el.value; });
  });
}

// 설문 검증 + 판정 + 저장. 반환: {ok, eligible, reason}
// DOM 대신 A 객체만 읽음 (on_finish 시점엔 설문 화면이 이미 사라짐)
function processSurvey(){
  const ageV=A._age||'';
  const age=parseInt(ageV,10);
  if(!A.l1)return{ok:false,msg:"Please answer question 1 (first language)."};
  if(!ageV)return{ok:false,msg:"Please enter your age."};
  if(!A.gender)return{ok:false,msg:"Please select your gender."};
  if(!A.hearing)return{ok:false,msg:"Please answer question 2 (hearing)."};
  if(!A.music)return{ok:false,msg:"Please answer the musical training question."};
  if(A.l1==='Korean'){
    if(!A.engtest)return{ok:false,msg:"Please answer question 3 (English proficiency test)."};
    if(!A.abroad)return{ok:false,msg:"Please answer question 4 (living abroad)."};
    if(!A.engmajor)return{ok:false,msg:"Please answer question 5 (English-related major)."};
    if(!A.engteacher)return{ok:false,msg:"Please answer question 6 (English teaching)."};
  }
  if(A.l1==='English'){
    if(!(A._origin||'').trim())return{ok:false,msg:"Please enter your country of origin."};
    if(!A._koreaDur||!A.koreaUnit)return{ok:false,msg:"Please answer question 4 (time in Korea)."};
    if(!A.otherlangs)return{ok:false,msg:"Please answer question 5 (other languages)."};
  }
  // 판정 (종료 조건: 나이, 청력만. 영어성적은 종료 조건 아님)
  let reason=null;
  if(A.hearing==='Yes')reason='hearing';
  else if(isNaN(age)||age<20||age>39)reason='age';
  const eligible=(reason===null);
  let koreaMonths=null;
  if(A.l1==='English'){const d=parseFloat(A._koreaDur);koreaMonths=(A.koreaUnit==='years')?d*12:d;}
  participantCode=makeCode();
  const row={
    session_id:sessionId, participant_id:participantCode, consent:true,
    age:age, gender:A.gender, l1:A.l1,
    hearing_impair:A.hearing==='Yes', music_training:A.music==='Yes',
    music_years:A.music==='Yes'?parseFloat(A._musicYears)||null:null,
    eng_test_type:A.l1==='Korean'?(A.engtest||null):null,
    eng_test_score:(A.l1==='Korean'&&A.engtest&&A.engtest!=='None')?(A._engScore||'').trim()||null:null,
    eng_major:A.l1==='Korean'?(A.engmajor==='Yes'):null,
    eng_major_name:(A.l1==='Korean'&&A.engmajor==='Yes')?(A._majorName||'').trim()||null:null,
    eng_major_year:(A.l1==='Korean'&&A.engmajor==='Yes'&&A._majorYear)?parseInt(A._majorYear,10):null,
    eng_teacher:A.l1==='Korean'?(A.engteacher==='Yes'):null,
    eng_teacher_years:(A.l1==='Korean'&&A.engteacher==='Yes'&&A._teacherDur)?parseFloat(A._teacherDur):null,
    lived_abroad:A.l1==='Korean'?(A.abroad==='Yes'):null,
    abroad_country:A.abroad==='Yes'?(A._abroadCountry||'').trim()||null:null,
    abroad_months:A.abroad==='Yes'?parseFloat(A._abroadMonths)||null:null,
    origin_country:A.l1==='English'?(A._origin||'').trim():null,
    korea_months:koreaMonths,
    other_langs:A.l1==='English'?(A.otherlangs==='Yes'):null,
    other_langs_text:A.otherlangs==='Yes'?(A._otherLangsText||'').trim()||null:null,
    eligible:eligible, exclusion_reason:reason,
    user_agent:navigator.userAgent, screen_w:screen.width, screen_h:screen.height
  };
  // 저장은 백그라운드 (화면 전환을 막지 않음). 실패해도 재시도.
  saveSubject(row);
  return{ok:true, eligible, reason};
}

// subjects 저장 — 재시도 + 로컬 백업
async function saveSubject(row){
  for(let attempt=1; attempt<=3; attempt++){
    try{ const {error}=await sb.from('subjects').insert(row); if(!error){subjectSaved=true; slog('subject saved'); return;} else throw error; }
    catch(e){ await new Promise(r=>setTimeout(r,800*attempt)); }
  }
  try{ localStorage.setItem('dg_subject_backup', JSON.stringify(row)); slog('subject saved locally'); }catch(e){}
}

// subjectSaved가 될 때까지 잠깐 기다리는 헬퍼 (설문 insert가 백그라운드라 시점이 어긋날 수 있음)
async function waitForSubject(maxMs){
  const start=Date.now();
  while(!subjectSaved && Date.now()-start<maxMs){ await new Promise(r=>setTimeout(r,300)); }
  return subjectSaved;
}

// 헤드폰 체크 점수를 이미 저장된 subjects 행에 업데이트 (참고용 기록)
async function saveHpScore(){
  if(hpScore===null) return;
  await waitForSubject(8000);   // 설문 저장이 끝나길 기다림
  for(let attempt=1; attempt<=4; attempt++){
    try{
      const {error}=await sb.from('subjects')
        .update({ headphone_score: hpScore, headphone_pass: hpScore>=HP_PASS })
        .eq('session_id', sessionId);
      if(!error){ slog('hp saved: '+hpScore); return; }
      else { slog('hp save err: '+(error.message||error.code||'?')); throw error; }
    }catch(e){ await new Promise(r=>setTimeout(r,700*attempt)); }
  }
  slog('hp save FAILED');
}

// 영어 변별 과제 점수를 subjects 행에 업데이트 (참고용 기록)
async function saveProfScore(){
  if(profTaskScore===null) return;
  await waitForSubject(8000);
  for(let attempt=1; attempt<=4; attempt++){
    try{
      const {error}=await sb.from('subjects')
        .update({ prof_task_score: profTaskScore, prof_target: profTargetScore, prof_stq: profStqScore })
        .eq('session_id', sessionId);
      if(!error){ slog('prof saved: '+profTaskScore); return; }
      else { slog('prof save err: '+(error.message||error.code||'?')); throw error; }
    }catch(e){ await new Promise(r=>setTimeout(r,700*attempt)); }
  }
  slog('prof save FAILED');
}

// 영어 변별 과제 블록 생성 (문항 순서 랜덤화, 각 문항의 개별 응답도 responses에 기록)
function makeEngTaskBlock(){
  const tl=[];
  const items=shuffle(ENG_TASK);
  const score={correct:0, target_dz:0, stq:0};
  const total=items.length;
  items.forEach((it,i)=>{
    const isLast=(i===total-1);
    tl.push({
      type:jsPsychHtmlButtonResponse,
      // 한 화면: 강조 단어(상단) + Audio A/B 재생 버튼 + A/B 선택 버튼
      stimulus:`<div class="instr" style="text-align:center">
        <div class="listen-label">Question ${i+1} / ${total}</div>
        <div class="prof-word" style="font-size:34px;font-weight:700;margin:20px 0 6px;letter-spacing:1px">${it.prompt}</div>
        <p style="color:var(--muted);margin-top:0">Think of the sound the <b>bold / underlined</b> letters make,<br>then find which audio contains that same sound.</p>
        <div style="display:flex;gap:16px;justify-content:center;margin:26px 0 8px">
          <button type="button" id="playA" class="audio-play-btn">▶ Audio A</button>
          <button type="button" id="playB" class="audio-play-btn">▶ Audio B</button>
        </div>
        <p style="color:var(--muted);font-size:14px">You can replay each sound as many times as you like.</p>
        <p style="margin-top:22px;font-weight:600">Which one has the same sound? ↓</p>
      </div>`,
      choices:["A", "B"],
      data:{phase:"prof_task", item_id:it.id, item_type:it.type, correct_answer:it.answer},
      on_load:()=>{
        // 오디오 요소 두 개를 만들어 버튼에 연결 (자유 재생)
        const aA=new Audio(ENG_BASE+it.a1), aB=new Audio(ENG_BASE+it.a2);
        const bA=document.getElementById('playA'), bB=document.getElementById('playB');
        if(bA)bA.addEventListener('click',()=>{ aB.pause(); aB.currentTime=0; aA.currentTime=0; aA.play(); bA.classList.add('playing-btn'); setTimeout(()=>bA.classList.remove('playing-btn'),700); });
        if(bB)bB.addEventListener('click',()=>{ aA.pause(); aA.currentTime=0; aB.currentTime=0; aB.play(); bB.classList.add('playing-btn'); setTimeout(()=>bB.classList.remove('playing-btn'),700); });
      },
      on_finish:(d)=>{
        const chosen=d.response+1;   // 0,1 → A(1),B(2)
        d.chosen=chosen;
        d.is_correct=(chosen===it.answer);
        // 유형별 정답 집계 (z/dʒ 와 s/tʃ 를 따로 셈). responses에는 저장하지 않음(점수만 필요).
        if(d.is_correct){
          score.correct++;
          if(it.type==='target_dz') score.target_dz++;
          else if(it.type==='filler_stq') score.stq++;
        }
        // 마지막 문항이 끝나면 총점 저장 (여기서 저장해야 확실히 실행됨)
        if(isLast){
          profTaskScore=score.correct;
          profTargetScore=score.target_dz;   // z/dʒ 정답 수 (0~6)
          profStqScore=score.stq;            // s/tʃ 정답 수 (0~6)
          saveProfScore();
        }
      }
    });
  });
  return {tl, score};
}

  let seq = buildSequence(stimuli);

  const hpAudio=[]; HP_SET_NAMES.forEach(n=>{for(let v=1;v<=3;v++)hpAudio.push(HP_BASE+n+v+".wav");});

  const mainAudio=[...new Set(blocks.flat().map(s=>AUDIO_BASE+s.audio_file))];
  const practiceAudio=PRACTICE.map(p=>AUDIO_BASE+p.audio);
  const engAudio=[]; ENG_TASK.forEach(it=>{ engAudio.push(ENG_BASE+it.a1); engAudio.push(ENG_BASE+it.a2); });

  timeline.push({type:jsPsychPreload, audio:[...hpAudio, ...engAudio, ...practiceAudio, ...mainAudio],

  // --- 1. 동의서 (설명문 원문 전체, 항목별 한/영 교차 표기 + 온라인 체크박스 동의) ---
  timeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div>
      <h2 style="text-align:center;color:var(--accent);margin-bottom:2px">Participant Information &amp; Consent</h2>
      <p style="text-align:center;color:var(--muted);font-size:14px;margin-top:0">연구대상자 설명문 및 동의서</p>
      <p style="text-align:center;font-size:13px;color:var(--muted);line-height:1.5">
        Lexically Mediated Compensation for Coarticulation in L1 and L2 Speech Perception:<br>
        The Impact of Preceding Sibilants on a /da/-/ga/ Continuum</p>
      <div class="consent-body" id="consentBody">
        <p style="margin-top:18px"><b>1. 연구배경과 목적 / Background and Purpose of the Study</b></p>
        <p style="margin:4px 0 10px">음성 지각(speech perception) 실험은 인간의 인지 처리 과정을 탐구하기 위한 주요 수단으로 활용되어 왔습니다. 인간의 언어 정보 처리가 하위 단계부터 상위 단계까지 순차적·독립적으로 이루어지는 모듈적(modular) 방식인지, 혹은 상·하위 단계가 상호작용하는 상호작용(interactive) 방식인지에 관한 논쟁에서, 상호작용 모델을 지지하는 주요 음향-음운론적 현상 중 하나가 바로 '어휘 매개 동시조음 보상 효과(Lexically Mediated Compensation for Coarticulation)'입니다.</p>
        <p style="margin:4px 0 10px">Elman과 McClelland(1988)는 영어 원어민이 /s/(예: Christmas)와 /ʃ/(예: Foolish)로 끝나는 단어 뒤에 연속체 자극(tape–cape)을 들었을 때, 앞선 단어의 끝소리에 따른 동시조음 효과로 인지 경계선이 이동하는 인지 보상 효과를 확인하였습니다. 나아가 연구진은 단어의 끝소리를 /s/와 /ʃ/ 사이의 모호한 음소로 대체하여 음소 단서(phonemic cue)를 제거하더라도, 청자가 상위 어휘 단서(lexical cue)를 활용하여 하위 음소 판단에 영향을 미치는 현상을 증명함으로써 상호작용 인지 모델인 TRACE 모델을 지지하였습니다.</p>
        <p style="margin:4px 0 10px">최근 해당 효과의 안정성과 재현성을 둘러싼 학술적 논쟁(Luthra et al., 2021; McQueen et al., 2023)이 지속됨에 따라, 본 효과가 서로 다른 모국어 배경을 가진 청자 집단(L1 vs. L2)에서도 동일하게 관찰되는지 정교한 통제 하에 재검증할 필요성이 제기됩니다.</p>
        <p style="margin:4px 0 10px">본 연구는 선행연구의 어휘 매개 동시조음 효과를 재검증함과 동시에, 한국어 모국어 청자(L2 영어 화자)와 영어 모국어 청자(L1 영어 화자) 간의 해당 효과가 나타나는 양상을 비교 분석하는 것을 목적으로 합니다.</p>
        <p style="margin:4px 0 10px">또한 L2 고숙련 화자가 음성 지각 과정에서 하위 음향 신호(Bottom-up)에만 의존하는지, 혹은 L1 원어민처럼 상위 어휘 맥락(Top-down)을 유연하게 활용하여 음향적 모호성을 보상하는지 밝혀냄으로써 제2언어 화자의 어휘-음운 통합 인지 처리 메커니즘을 명확히 규명하고자 합니다.</p>
        <p style="margin:4px 0 10px">Speech perception experiments have long served as a key method for investigating human cognitive processing. Within the debate over whether language processing occurs in a strictly sequential, modular fashion or through interaction between higher- and lower-level processes, one of the key acoustic-phonological phenomena supporting the interactive model is "Lexically Mediated Compensation for Coarticulation."</p>
        <p style="margin:4px 0 10px">Elman and McClelland (1988) found that native English speakers, upon hearing a continuum stimulus (tape–cape) following words ending in /s/ (e.g., Christmas) versus /ʃ/ (e.g., Foolish), showed a shift in their perceptual category boundary consistent with coarticulatory compensation based on the preceding word's final sound. Furthermore, even when the final sound of the preceding word was replaced with an ambiguous phoneme between /s/ and /ʃ/ — removing the phonemic cue itself — listeners still used higher-level lexical cues to influence lower-level phonemic judgments, supporting the interactive cognitive model known as TRACE.</p>
        <p style="margin:4px 0 10px">Given ongoing academic debate about the robustness and replicability of this effect (Luthra et al., 2021; McQueen et al., 2023), there is a need to re-examine, under careful experimental control, whether this effect is equally observed across listener groups with different native-language backgrounds (L1 vs. L2).</p>
        <p style="margin:4px 0 10px">This study aims to re-verify the lexically mediated coarticulation effect found in prior research, while comparing how this effect manifests between native Korean listeners (L2 English speakers) and native English listeners (L1 English speakers).</p>
        <p style="margin:4px 0 10px">It also aims to clarify the cognitive mechanism of lexical-phonological integration in second-language speakers by determining whether highly proficient L2 speakers rely solely on bottom-up acoustic signals during speech perception, or whether, like native speakers, they flexibly use top-down lexical context to resolve acoustic ambiguity.</p>
        <p style="margin-top:18px"><b>2. 연구대상(선정과 제외기준, 대상자수 산정근거 등) / Study Participants (Inclusion/Exclusion Criteria, Sample Size Justification, etc.)</b></p>
        <p style="margin:4px 0 10px">1.1. 연구대상자 수 산정 근거: 본 연구의 필요 연구대상자 수는 G*Power 3.1.9.7 프로그램을 활용하여 산정하였습니다. 2(집단 간 요인: 한국어 화자, 영어 화자) × 2(집단 내 요인: 조음 위치 조건) 혼합 요인 분산분석(ANOVA: Repeated measures, within-between interaction)을 기준으로, 인지언어학 분야의 표준 효과 크기인 중간 효과 크기(Effect size f = 0.25), 유의수준 α = .05, 통계적 검정력(Statistical Power) 1-β = .80을 설정하여 산출하였습니다. 계산 결과 본 연구에 필요한 최소 총 샘플 수는 34명(집단당 최소 17명)으로 산출되었습니다. 본 연구에서는 불성실 응답, 중도 포기, 음성 인지 과제 반응시간 데이터 이상치로 인한 데이터 탈락률을 고려하여 각 집단당 25명씩, 총 50명을 최종 연구 대상자로 설정하였습니다.</p>
        <p style="margin:4px 0 10px">1.2. 선정기준</p>
        <p style="margin:4px 0 10px">1.2.1. 공통 선정기준: 만 20세 이상 만 39세 이하의 청년층으로, 정상 청력을 가진 자.</p>
        <p style="margin:4px 0 10px">1.2.2. 한국어 모국어 화자 선정기준(고숙련 L2 영어 화자, 25명): 다음의 영어 숙련도 요건 중 하나 이상을 충족하는 자</p>
        <p style="margin:4px 0 10px">1.2.2.1. 어학 성적: TOEIC 900점, TOEFL 80점, IELTS 6.5점 이상</p>
        <p style="margin:4px 0 10px">1.2.2.2. 체류 경험: 영어 모국어 국가(미국, 캐나다 등) 거주 경험 3년 이상</p>
        <p style="margin:4px 0 10px">1.2.2.3. 전공: 영어 관련 전공(영어영문학, 영어교육학 등) 학부 3학년 이상</p>
        <p style="margin:4px 0 10px">1.2.2.4. 교육 경력: 입시 영어를 제외한 회화/발음 관련 영어 교육 종사자</p>
        <p style="margin:4px 0 10px">1.2.3. 영어 모국어 화자 선정기준(L1, 25명): 영어권 국가에서 출생하고 성장했으며, 한국어를 제 2외국어로 하지 않는 만 20세~39세의 영어 모국어 화자.</p>
        <p style="margin:4px 0 10px">1.2.4. 제외기준(공통): 청각 장애, 언어 장애, 신경과적 질환 또는 인지적 장애가 있는 자. 시력 교정 후에도 화면의 문자를 읽기 어려운 자.</p>
        <p style="margin:4px 0 10px">2.1. Sample size justification: The required number of participants was calculated using G*Power 3.1.9.7. Based on a 2 (between-subjects factor: Korean speakers, English speakers) × 2 (within-subjects factor: place-of-articulation condition) mixed ANOVA (repeated measures, within-between interaction), using a medium effect size standard in cognitive linguistics (effect size f = 0.25), significance level α = .05, and statistical power 1-β = .80, the minimum required total sample size was calculated as 34 (minimum 17 per group). Accounting for anticipated data loss due to careless responding, dropout, and outliers in reaction-time data, this study sets a final target of 25 participants per group, for a total of 50 participants.</p>
        <p style="margin:4px 0 10px">2.2. Inclusion Criteria</p>
        <p style="margin:4px 0 10px">2.2.1. General criteria: Adults aged 20–39 with normal hearing.</p>
        <p style="margin:4px 0 10px">2.2.2. Native Korean speakers (highly proficient L2 English speakers, 25 participants): must meet at least one of the following English proficiency requirements:</p>
        <p style="margin:4px 0 10px">2.2.2.1. Test scores: TOEIC 900+, TOEFL 80+, or IELTS 6.5+</p>
        <p style="margin:4px 0 10px">2.2.2.2. Residency experience: 3+ years living in an English-speaking country (e.g., the U.S., Canada)</p>
        <p style="margin:4px 0 10px">2.2.2.3. Major: Third-year or above undergraduate in an English-related major (e.g., English Language and Literature, English Education)</p>
        <p style="margin:4px 0 10px">2.2.2.4. Teaching experience: Currently working in English conversation/pronunciation education (excluding test-prep English instruction)</p>
        <p style="margin:4px 0 10px">2.2.3. Native English speakers (L1, 25 participants): Born and raised in an English-speaking country, aged 20–39, for whom Korean is not a second language.</p>
        <p style="margin:4px 0 10px">2.2.4. Exclusion Criteria (both groups): Hearing impairment, speech/language disorder, neurological or cognitive impairment. Difficulty reading on-screen text even with corrective lenses.</p>
        <p style="margin-top:18px"><b>3. 연구 참여 기간, 방법 및 절차(동의취득방법, 중재, 자료수집방법 등 포함) / Study Duration, Procedures, and Methods (including consent procedure, data collection, etc.)</b></p>
        <p style="margin:4px 0 10px">가. 본 실험은 웹 기반 온라인 실험으로, 공유되는 웹사이트 링크를 통해 진행됩니다. 참가자는 본인의 컴퓨터와 헤드폰을 활용하여 실험에 참여하며, 전체 소요 시간은 약 40분~50분입니다.</p>
        <p style="margin:4px 0 10px">나. 연구 절차</p>
        <p style="margin:4px 0 10px">1. 동의 취득(약 5분): 실험 웹사이트 접속 후 첫 화면에 본 설명문과 동일한 내용을 제시하고, 동의 버튼을 클릭하는 것으로 동의 의사를 수집합니다.</p>
        <p style="margin:4px 0 10px">2. 사전검사(약 5분): 국적, 나이, 성별, 모국어, 제2외국어 여부, 청각 장애 여부, 음악적 훈련 경험 여부와 더불어, 지원 자격 확인을 위한 영어 숙련도 관련 정보(예: 어학 성적, 해외 거주 경험, 영어 관련 학과 재학 여부, 영어 회화/발음 교육 종사자 여부)를 기입하신 후 간단한 헤드폰 스크리닝 테스트를 실시합니다.</p>
        <p style="margin:4px 0 10px">3. 본 실험(약 30분): 헤드폰을 착용하고 청각 자극을 들은 직후 강제 선택 과제(예: davino 또는 gavino 버튼 선택)를 수행합니다. 피로도 경감을 위해 세션 중간에 3회의 휴식 시간을 제공합니다.</p>
        <p style="margin:4px 0 10px">4. 실험 종료 및 사후 설문 조사(약 10분): 간단한 영어 숙련도 테스트와 실험에 관한 몇 가지 질문에 답변합니다. 이후 보상 지급을 위한 별도의 플랫폼(Google form)을 통해 자동 생성된 실험 참가 코드와 연락처를 제출합니다.</p>
        <p style="margin:4px 0 10px">a. This experiment is a fully web-based online experiment conducted via a shared website link. Participants take part using their own computer and headphones, and the total duration is approximately 40–50 minutes.</p>
        <p style="margin:4px 0 10px">b. Study Procedure</p>
        <p style="margin:4px 0 10px">1. Obtaining consent (~5 min): The same content as this information sheet is presented on the first screen after accessing the experiment website, and consent is recorded by clicking the "Agree" button.</p>
        <p style="margin:4px 0 10px">2. Pre-screening (~5 min): Participants provide their nationality, age, gender, native language, whether they have a second language, hearing impairment status, and musical training experience, along with information to confirm eligibility (e.g., test scores, time lived abroad, enrollment in an English-related major, work in English conversation/pronunciation teaching), followed by a brief headphone screening test.</p>
        <p style="margin:4px 0 10px">3. Main experiment (~30 min): Participants wear headphones and, immediately after hearing each auditory stimulus, perform a forced-choice task (e.g., selecting "davino" or "gavino"). Three self-paced breaks are provided during the session to reduce fatigue.</p>
        <p style="margin:4px 0 10px">4. Debriefing and post-experiment survey (~10 min): Participants complete a brief English proficiency test and answer a few questions about their experience. They then submit an automatically generated participation code and contact information through a separate platform (Google Form) used for reward distribution.</p>
        <p style="margin-top:18px"><b>4. 연구대상자가 준수해야 할 사항 / Participant Responsibilities</b></p>
        <p style="margin:4px 0 10px">본 실험은 웹 기반 온라인 실험으로, 공유되는 웹사이트 링크를 통해 진행됩니다. 참가자는 본인의 컴퓨터와 헤드폰을 활용하여, 청취에 방해되는 큰 소음이 없는 환경에서 실험에 참여해야 합니다.</p>
        <p style="margin:4px 0 10px">This experiment is a fully web-based online experiment conducted via a shared website link. Participants must use their own computer and headphones and take part in an environment free of loud noise that could interfere with listening.</p>
        <p style="margin-top:18px"><b>5. 연구대상자에게 예상되는 위험과 이득 / Expected Risks and Benefits</b></p>
        <p style="margin:4px 0 10px">가. 위험 요소: 헤드폰 착용 및 컴퓨터 화면 주시에 따른 경미한 피로감이 발생할 수 있으나, 신체적·정신적 최소위험(Minimal Risk) 이하입니다. 음량은 참가자 본인이 자유롭게 조절할 수 있으며, 실험 중 휴식 시간을 제공합니다.</p>
        <p style="margin:4px 0 10px">나. 직접적 이익: 연구대상자에게 직접적인 의학적/금전적 이득(보상금 제외)은 없으나, 음성 지각 실험 참여를 통한 인지과학 연구 절차 체험 기회를 제공합니다.</p>
        <p style="margin:4px 0 10px">a. Risks: Minor fatigue may result from wearing headphones and viewing the computer screen, but this is at or below minimal risk. Participants may freely adjust the volume themselves, and self-paced breaks are provided during the experiment.</p>
        <p style="margin:4px 0 10px">b. Direct benefits: There is no direct medical or financial benefit to participants (aside from compensation), but participants will have the opportunity to experience a cognitive science research procedure through participation in a speech perception experiment.</p>
        <p style="margin-top:18px"><b>6. 대상자의 사생활과 개인정보 보호(익명화, 암호화 및 보안대책 등 포함) / Protection of Privacy and Personal Information (anonymization, encryption, and security measures)</b></p>
        <p style="margin:4px 0 10px">가. 익명화 및 식별코드 부여: 수집된 모든 정보 및 반응 데이터는 이름 등 개인 식별 정보를 제거하고 고유 연구 코드(예: DG-4AKEHF)로 대체하여 관리합니다. 수집되는 정보는 사전 검사 절차에서 기입하실 국적, 나이, 성별, 모국어, 제2외국어 여부, 청각 장애 여부, 음악적 훈련 경험 여부와 더불어, 지원 자격 확인을 위한 영어 숙련도 관련 정보(예: 어학 성적, 해외 거주 경험, 영어 관련 학과 재학 여부, 영어 회화/발음 교육 종사자 여부)에 한합니다. 보상용 연락처는 연구 반응 데이터와 분리된 별도 경로(Google form)로 수집되어 연구 데이터와 연결되지 않으며, 실험 후 보상 지급이 완료되면 폐기됩니다. 본 연구는 모든 자료를 온라인으로 수집하며, 별도의 서면 자료는 생성되지 않습니다.</p>
        <p style="margin:4px 0 10px">나. 데이터 보관: 전자 데이터는 연구자의 PC 및 클라우드에 보관합니다.</p>
        <p style="margin:4px 0 10px">다. 폐기 계획: 관련 법령 및 IRB 규정에 따라 연구 종료 후 3년간 보관하며, 보관 기간 종료 후 전자 파일을 복구 불가능한 방법으로 영구 삭제합니다.</p>
        <p style="margin:4px 0 10px">a. Anonymization and ID coding: All collected information and response data are stripped of personally identifying information (such as name) and managed instead under a unique research code (e.g., DG-4AKEHF). The information collected is limited to what is entered during pre-screening — nationality, age, gender, native language, second-language status, hearing impairment status, musical training experience — along with information needed to confirm eligibility (e.g., test scores, time lived abroad, English-related major enrollment, English teaching experience). Contact information collected for reward distribution is gathered through a separate channel (Google Form) from the research response data and is not linked to it; it is discarded once the reward has been issued. This study collects all data online, and no physical/paper records are generated.</p>
        <p style="margin:4px 0 10px">b. Data storage: Electronic data is stored on the researcher's personal computer and in cloud storage.</p>
        <p style="margin:4px 0 10px">c. Disposal plan: In accordance with relevant laws and IRB regulations, data will be retained for 3 years after the end of the study, after which electronic files will be permanently deleted using an unrecoverable method.</p>
        <p style="margin-top:18px"><b>7. 연구에 참여함으로써 연구대상자가 부담해야 할 예상 비용 / Expected Costs to Participants</b></p>
        <p style="margin:4px 0 10px">본 연구 참여로 인해 연구대상자가 부담해야 하는 별도의 금전적 예상 비용은 없습니다.</p>
        <p style="margin:4px 0 10px">There is no expected monetary cost to participants from taking part in this study.</p>
        <p style="margin-top:18px"><b>8. 연구대상자 보상 및 연구 참여에 따른 손실에 대한 보상 / Compensation for Participation and Any Loss Incurred</b></p>
        <p style="margin:4px 0 10px">실험 참가를 완료한 대상자에게 소요 시간에 대한 보상으로 카카오톡을 통해 소정의 기프티콘을 지급합니다.</p>
        <p style="margin:4px 0 10px">Participants who complete the experiment will receive compensation for their time in the form of an e-gift card, sent via email.</p>
        <p style="margin-top:18px"><b>9. 연구 참여를 제한하는 경우 / Circumstances That May Limit Participation</b></p>
        <p style="margin:4px 0 10px">실험 참가 조건에 해당하지 않는 자(한국어나 영어가 모국어가 아닌 자, 또는 청각 장애, 언어 장애, 신경과적 질환 또는 인지적 장애가 있는 자, 시력 교정 후에도 화면의 문자를 읽기 어려운 자)는 연구 참여가 제한될 수 있습니다.</p>
        <p style="margin:4px 0 10px">Individuals who do not meet the eligibility criteria (e.g., those whose native language is neither Korean nor English, or those with a hearing impairment, language disorder, neurological or cognitive impairment, or difficulty reading on-screen text even with corrective lenses) may be excluded from participation.</p>
        <p style="margin-top:18px"><b>10. 연구대상자의 안전보호대책 / Safety Protection Measures</b></p>
        <p style="margin:4px 0 10px">가. 실험 진행 중 대상자가 불편함이나 피로감을 호소할 경우 즉시 휴식을 취하게 하거나 실험을 중단할 수 있음을 사전에 안내합니다.</p>
        <p style="margin:4px 0 10px">나. 연구 참여는 순수한 자의에 의해서만 이루어지며, 언제든지 불이익 없이 참여를 거부하거나 중도 철회할 수 있음을 명시합니다.</p>
        <p style="margin:4px 0 10px">a. If a participant reports discomfort or fatigue during the experiment, they will be advised in advance that they may take an immediate break or discontinue the experiment.</p>
        <p style="margin:4px 0 10px">b. Participation is entirely voluntary, and participants may decline to participate or withdraw at any time without any penalty, as clearly stated.</p>
        <p style="margin-top:18px"><b>11. 개인정보제공(이번 연구에서 얻어진 자료를 제3자에게 제공하는 경우) / Disclosure of Personal Information (if data from this study is provided to third parties)</b></p>
        <p style="margin:4px 0 10px">본 연구에서 수집된 모든 개인정보 및 연구 데이터는 연구 식별코드(예: DG-4AKEHF)로 익명화하여 엄격히 보호합니다. 수집된 자료는 연구 목적 이외의 용도로 절대 사용되지 않으며, 원칙적으로 제3자에게 제공되지 않습니다. 다만, 연구 결과의 검증 및 데이터 공유 문화(Open Science) 정책에 따라 연구 데이터를 학술지나 데이터 저장소에 공개할 수 있으며, 이 경우 개인을 식별할 수 있는 모든 정보는 완전히 삭제된 익명화 데이터 형태로만 제공합니다.</p>
        <p style="margin:4px 0 10px">All personal information and research data collected in this study are strictly protected through anonymization using a research ID code (e.g., DG-4AKEHF). Collected data will never be used for any purpose other than this research and will not, in principle, be shared with third parties. However, in line with verification standards and Open Science data-sharing practices, research data may be made publicly available in academic journals or data repositories; in such cases, only fully anonymized data with all personally identifiable information removed will be shared.</p>
        <p style="margin-top:18px"><b>12. 연구참여의 자발성과 동의의 철회 / Voluntary Participation and Right to Withdraw</b></p>
        <p style="margin:4px 0 10px">본 연구 참여는 순수하게 연구대상자의 자발적인 의사에 따라 결정됩니다. 연구대상자는 연구 참여에 동의하지 않을 권리가 있으며, 연구가 시작된 후라도 언제든지 불이익이나 불이익에 대한 우려 없이 동의를 철회하고 참여를 중단할 수 있습니다. 동의 철회 시 이미 수집된 개인정보 및 반응 데이터는 즉시 영구 파기됩니다.</p>
        <p style="margin:4px 0 10px">Participation in this study is based entirely on the voluntary decision of the participant. Participants have the right to decline participation, and may withdraw their consent and discontinue participation at any time, even after the study has begun, without any penalty or concern of disadvantage. If consent is withdrawn, any personal information and response data already collected will be permanently destroyed immediately.</p>
        <p style="margin-top:18px"><b>13. 연구결과에 대한 열람 / Access to Study Results</b></p>
        <p style="margin:4px 0 10px">연구자, 의뢰자, 정부기관 실태조사 시 연구결과의 열람이 가능합니다.</p>
        <p style="margin:4px 0 10px">Study results may be reviewed by the researchers, the sponsor, or government regulatory bodies conducting an audit.</p>
        <p style="margin-top:18px"><b>14. 연구자의 연락처 / Researcher Contact Information</b></p>
        <p style="margin:4px 0 10px">연구 진행 과정에서 질문이나 의문 사항이 있거나, 연구 관련 상해/불편함이 발생한 경우 언제든지 아래 연구자에게 연락 주시기 바랍니다.</p>
        <p style="margin:4px 0 10px">연구책임자: 조현지 (부산대학교 영어영문학과 석사과정, angelhj81@gmail.com, 010-7443-1048)</p>
        <p style="margin:4px 0 10px">If you have any questions or concerns during the course of the study, or experience any research-related injury or discomfort, please contact the researcher below at any time.</p>
        <p style="margin:4px 0 10px">Principal Investigator (Study Coordinator): Hyeonji Cho (Master's student, Department of English Language and Literature, Pusan National University; angelhj81@gmail.com; +82-10-7443-1048)</p>
      </div>

      <p style="font-size:14px;line-height:1.6;text-align:left;max-width:560px;margin:16px auto 4px">
        본인은 위 설명문의 내용(연구의 목적, 절차, 예상되는 위험과 이익, 개인정보 보호 방법, 보상, 자발적 참여와 철회의 권리 등)을 모두 읽고 충분히 이해하였으며, 이에 대해 자유롭게 질문하고 답변을 받을 기회가 있었습니다. 본인은 자발적으로 이 연구에 참여할 것에 동의합니다.<br><br>
        I have read and fully understood the content of the information sheet above (the purpose, procedures, expected risks and benefits, personal information protection, compensation, and my right to voluntary participation and withdrawal), and I have had the opportunity to ask questions and receive satisfactory answers. I voluntarily agree to participate in this study.
      </p>

      <label class="checkline" id="consentCheckWrap" style="justify-content:center;font-size:14.5px;margin:14px 0 4px;line-height:1.6;text-align:left;max-width:560px;margin-left:auto;margin-right:auto">
        <input type="checkbox" id="consentCheck" style="margin-top:3px">
        <span>"위 내용을 모두 읽고 이해하였으며, 본 연구 참여에 자발적으로 동의합니다."<br>
        "I have read and understood all of the above and voluntarily agree to participate in this study."</span>
      </label>
    </div>`,
    choices:["동의하고 시작하기 / Agree and Start"],
    on_load:function(){
      const btnWrap=document.querySelector('#jspsych-html-button-response-btngroup');
      const btn=btnWrap?btnWrap.querySelector('button'):null;
      const chk=document.getElementById('consentCheck');
      if(btn){
        btn.disabled=true; btn.style.opacity='0.45'; btn.style.cursor='not-allowed';
      }
      if(chk && btn){
        chk.addEventListener('change',()=>{
          btn.disabled=!chk.checked;
          btn.style.opacity=chk.checked?'1':'0.45';
          btn.style.cursor=chk.checked?'pointer':'not-allowed';
        });
      }
    }});

  // --- 2. 설문 (검증 실패 시 같은 화면 유지) ---
  const surveyNode={type:jsPsychHtmlButtonResponse, stimulus:surveyHTML, choices:["Submit"],
    on_load:bindSurvey,
    on_finish:(data)=>{
      const res=processSurvey();
      data.survey_ok=res.ok; data.eligible=res.eligible; data.reason=res.reason; data.msg=res.msg;
    }};
  const surveyLoop={timeline:[surveyNode],
    loop_function:(d)=>{ const last=d.values()[d.values().length-1];
      if(!last.survey_ok){ setTimeout(()=>{const e=document.getElementById('surveyErr');if(e)e.textContent=last.msg;},50); return true; }
      return false; }};
  timeline.push(surveyLoop);

  // --- 3. 자격 미달 종료 (조건부) ---
  let excluded=false;
  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Thank you for your interest</h2>
      <p>Based on your responses, you do not meet the participation criteria for this study.</p>
      <p style="color:var(--muted)">You may now close this window. We appreciate your time.</p></div>`,
    choices:[]}],
    conditional_function:()=>{ const d=jsPsych.data.get().filter({trial_type:'html-button-response'}).values();
      const s=d.reverse().find(x=>x.eligible!==undefined); excluded=(s && s.eligible===false); return excluded; }});

  // 이후 노드는 자격 통과자만 (excluded면 실험 종료 상태)
  const notExcluded=()=>!excluded;

  // --- 4. 헤드폰 체크 (통과/탈락 없음 — 안내 후 1회 실시, 점수만 기록하고 항상 통과) ---
  const hpResult={correct:0};

  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>헤드폰 확인 / Headphone check</h2>
      <p>이 실험은 <b>헤드폰이나 이어폰</b> 착용을 권장합니다. / We recommend wearing <b>headphones</b> for this study.</p>
      <p>다음 6개 문제에서, 잡음(쉬이익)이 <b>3번</b> 연달아 재생됩니다. 셋 다 크기는 같지만 <b>하나에만</b> 희미한 삐— 소리가 숨어 있습니다. 그게 몇 번째인지 골라 주세요.<br>
      <span style="color:var(--muted)">You'll hear noise 3 times; all same loudness, but only one hides a faint tone. Pick which one.</span></p>
      <p style="color:var(--muted)">먼저 조절음으로 볼륨을 편안하게 맞추세요. / First set a comfortable volume with the calibration sound.</p></div>`,
    choices:["시작 / Start"]}], conditional_function:notExcluded});

  timeline.push({type:jsPsychAudioButtonResponse, stimulus:HP_BASE+"HugginsPitch_calibration.wav",
    prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div>
      <div class="qtext" style="margin-bottom:10px">볼륨 조절 / Volume check</div>
      <p style="color:var(--muted)">이 소리는 <b>볼륨 조절용</b>입니다. 편안한 크기로 맞춘 뒤 계속하세요.<br>This is only for setting your volume. Adjust it, then continue.</p></div>`,
    choices:["볼륨을 맞췄습니다 / Volume is set"], response_allowed_while_playing:true,
    conditional_function:notExcluded} );

  // 캘리브레이션과 본 검사 사이 명확한 구분 (노이즈 혼동 방지)
  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr" style="text-align:center"><h2>이제 검사를 시작합니다 / Test begins now</h2>
      <p>볼륨 조절이 끝났습니다. 지금부터 <b>6개의 문제</b>가 나옵니다.</p>
      <p>각 문제에서 잡음이 <b>3번</b> 이어서 재생됩니다. 그중 <b>하나에만</b> 희미한 삐— 소리가 숨어 있으니, 몇 번째인지 고르세요.<br>
      <span style="color:var(--muted)">Volume is set. Now 6 questions follow. In each, you'll hear 3 noises; only one hides a faint tone. Pick which one (1st, 2nd, 3rd).</span></p></div>`,
    choices:["첫 문제 시작 / Start question 1"]}], conditional_function:notExcluded});

  // 검사 1회 실시 — 결과와 무관하게 다음으로 진행
  timeline.push({timeline:makeHPBlock(1,hpResult), conditional_function:notExcluded});

  // 완료 안내 (통과/탈락 문구 없음, 항상 같은 다음 단계로)
  timeline.push({timeline:[{type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>확인 완료 / Check complete</h2>
      <p>헤드폰 확인이 끝났습니다. 실험으로 넘어갑니다.<br><span style="color:var(--muted)">Headphone check complete. Proceeding to the experiment.</span></p></div>`,
    choices:["계속 / Continue"],
    on_finish:()=>{ hpScore=hpResult.correct; saveHpScore(); }}], conditional_function:notExcluded});

  // --- 소리 맞추기 과제는 본 실험 종료 후 실시 (자격 통과자 전원, 아래 mainTimeline 끝부분에 배치) ---
  const engBlock=makeEngTaskBlock();

  // 헤드폰 결과와 무관하게 자격 통과자는 모두 본 실험으로 진행
  const canProceed=()=>notExcluded();

  // --- 5~8: 지시 → 연습 → 본실험 → 완료 를 하나의 conditional timeline으로 묶음 ---
  const mainTimeline=[];

  // 5. 지시문
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Instructions</h2><ul>
      <li><b>Environment.</b> Wear headphones and stay in a quiet room.</li>
      <li><b>Volume.</b> You'll set your volume during the practice trials. Once the main session starts, keep it unchanged.</li>
      <li><b>Audio.</b> Each clip plays <b>only once</b>. You cannot replay or pause it.</li>
      <li><b>Response.</b> Respond as quickly as possible based on your first impression. There are no right or wrong answers.</li>
      <li><b>Duration &amp; breaks.</b> About 740 trials (40–60 min), with three short self-paced breaks.</li>
      </ul><p style="text-align:center">First, let's set your volume and do a few practice trials.</p></div>`,
    choices:["Next / 다음"]});

  // 5-b. 볼륨 재조정 안내 (헤드폰 체크와 본 실험은 적정 음량이 다름)
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Adjust your volume</h2>
      <p>The headphone test may have required a higher volume. From now on, you'll be listening to <b>speech</b>.</p>
      <p>Use the practice sounds that follow to set a <b>comfortable and clear</b> level for the voice. Once you've set it, please keep it unchanged throughout the main experiment.</p></div>`,
    choices:["Start practice"]});

  // 6. 연습 (저장 안 함)
  PRACTICE.forEach((p,pi)=>{
    let left, right;
    if(p.correct===null){ left=p.opt1; right=p.opt2; }  // Target: 고정
    else{ const swap=Math.random()<0.5; left=swap?p.opt2:p.opt1; right=swap?p.opt1:p.opt2; }  // distractor: 랜덤
    mainTimeline.push(
      {type:jsPsychAudioButtonResponse, stimulus:AUDIO_BASE+p.audio,
        prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div><div class="listen-label">Practice ${pi+1}/${PRACTICE.length} · Listen…</div></div>`,
        choices:[], trial_ends_after_audio:true, response_allowed_while_playing:false},
      {type:jsPsychHtmlButtonResponse, stimulus:`<div class="qtext">${p.question}</div>`, choices:[left,right]}
    );
  });
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>Practice complete</h2>
      <p>The real experiment begins now. Each sound plays <b>only once</b>, so respond based on your first impression.</p>
      <p><b>Please keep your volume as it is now.</b></p></div>`,
    choices:["Begin the experiment"]});

  // 7. 본 실험
  const totalTrials=blocks.flat().length;
  let gIdx=0;
  blocks.forEach((block,bi)=>{
    block.forEach(stim=>{
      gIdx++; const gi=gIdx;
      // Target: 좌우 고정 (opt1=Davino 왼쪽, opt2=Gavino 오른쪽). Distractor: 좌우 랜덤.
      let left, right;
      if(stim.type==='Target'){
        left=stim.opt1; right=stim.opt2;
      }else{
        const swap=Math.random()<0.5; left=swap?stim.opt2:stim.opt1; right=swap?stim.opt1:stim.opt2;
      }
      mainTimeline.push(
        {type:jsPsychAudioButtonResponse, stimulus:AUDIO_BASE+stim.audio_file,
          prompt:`<div class="playing"><div class="speaker">${SPEAKER_SVG}</div><div class="listen-label">Listen…</div></div>`,
          choices:[], trial_ends_after_audio:true, response_allowed_while_playing:false},
        {type:jsPsychHtmlButtonResponse, stimulus:`<div class="qtext">${stim.question}</div>`, choices:[left,right],
          on_finish:(d)=>{
            const word=(d.response===0)?left:right;
            queueResponse({ session_id:sessionId, trial_index:gi, block:bi+1,
              item_id:stim.item_id, type:stim.type, context_type:stim.context_type,
              context_word:stim.context_word, place:stim.place, voicing:stim.voicing,
              step:stim.step, repetition:stim.repetition, audio_file:stim.audio_file,
              option_left:left, option_right:right, response:word,
              correct_answer:stim.correct, is_correct:(stim.correct===null)?null:(word===stim.correct), rt:d.rt });
          }}
      );
    });
    if(bi<blocks.length-1){
      mainTimeline.push({type:jsPsychHtmlButtonResponse,
        stimulus:()=>`<div class="instr" style="text-align:center"><h2>Break ${bi+1} of ${N_BLOCKS-1}</h2>
          <p>You've completed block ${bi+1} of ${N_BLOCKS}.</p>
          <p style="color:var(--muted)">Take a short rest. Continue when ready.</p>
          <div class="progress-bar"><div style="width:${Math.round(gIdx/totalTrials*100)}%"></div></div>
          <p style="color:var(--muted);font-size:14px">${gIdx} / ${totalTrials}</p></div>`,
        choices:["Continue"], on_load:()=>flushResponses(true)});
    }
  });

  // --- 소리 맞추기 과제 (본 실험 종료 후, 자격 통과자 전원, 점수만 기록) ---
  const engAnnounce={type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr"><h2>One last task</h2>
      <p>The main experiment is complete. Before you finish, here is a short <b>sound-matching task</b> (${ENG_TASK.length} questions).</p>
      <p>A word will appear at the top with part of it in <b>bold and underlined</b>. Think of the sound those letters make. Then play <b>Audio A</b> and <b>Audio B</b> — as many times as you like — and choose the one that contains the <b>same sound</b>.</p></div>`,
    choices:["Start"],
    on_load:()=>flushResponses(true)};  // 영어 과제 전에 본 실험 응답을 모두 저장
  // 안내 + 문항들을 하나의 timeline으로 묶음 (본 실험까지 온 참가자 전원)
  mainTimeline.push({timeline:[engAnnounce, ...engBlock.tl]});

  // 8. 저장 완료 대기 화면 (마지막 배치가 확실히 저장될 때까지 기다림 — 데이터 누락 방지)
  //    저장이 끝나면 버튼이 활성화됨. jsPsych.finishTrial() 대신 버튼 방식이라 타이밍이 안정적.
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr" style="text-align:center"><h2>Saving your responses…</h2>
      <p>응답을 저장하고 있습니다. 잠시만 기다려 주세요.<br>
      <span style="color:var(--muted)">Please wait a moment while we save your responses.</span></p>
      <p id="saveStatus" style="color:var(--muted);font-size:14px">저장 중… / Saving…</p></div>`,
    choices:["계속 / Continue"],
    on_load: function(){
      // "계속" 버튼을 처음엔 숨김 → 저장이 다 끝나면 보여줌
      const btnWrap=document.querySelector('#jspsych-html-button-response-btngroup');
      if(btnWrap) btnWrap.style.visibility='hidden';
      (async function(){
        const start=Date.now();
        // 남은 응답을 모두 저장할 때까지 반복 (최대 20초)
        while(responseBuffer.length>0 && Date.now()-start<20000){
          await flushResponses(true);
          if(responseBuffer.length>0) await new Promise(r=>setTimeout(r,500));
        }
        slog('final flush done, remaining: '+responseBuffer.length);
        // 저장 완료 표시 + 버튼 보이기
        const st=document.getElementById('saveStatus');
        if(st){ st.textContent='저장 완료 · Saved ✓'; st.style.color='var(--ok)'; }
        if(btnWrap) btnWrap.style.visibility='visible';
      })();
    }
  });

  // 9. 완료 코드
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:()=>`<div class="instr" style="text-align:center"><h2>All done — thank you! 🎧</h2>
      <p>실험을 모두 마쳤습니다. 보상을 받으려면 아래 <b>완료 코드</b>를 폼에 제출해 주세요.<br>
      <span style="color:var(--muted)">You've completed the experiment. To receive your reward, submit the code below.</span></p>
      <div class="code-box">${participantCode}</div>
      <p><b>제출 방법 / How to submit:</b><br>
      아래 링크를 열어 이 코드를 입력하세요. / Open the link below and enter this code:</p>
      <p><a href="${REWARD_FORM_URL}" target="_blank" style="color:var(--accent);font-weight:600;font-size:17px">▶ 보상 신청 폼 열기 / Open reward form</a></p>
      <p style="color:var(--muted);font-size:13px">코드를 복사해 두세요. 이 창을 닫으면 다시 볼 수 없습니다.<br>Please copy your code — it won't be shown again after you close this window.</p></div>`,
    choices:["완료 / Finish"], on_load:()=>flushResponses(true)});

  // 10. 종료 안내 화면 (하얀 화면 대신 명확한 종료 메시지)
  mainTimeline.push({type:jsPsychHtmlButtonResponse,
    stimulus:`<div class="instr" style="text-align:center">
      <h2>You're all done</h2>
      <p>Thank you very much for taking part in this study. 🙏<br>
      <span style="color:var(--muted)">실험에 참여해 주셔서 진심으로 감사합니다.</span></p>
      <p>If you haven't submitted the reward form yet, please use the link below.<br>
      <span style="color:var(--muted)">보상 신청 폼을 아직 제출하지 않으셨다면, 아래 링크에서 제출해 주세요.</span></p>
      <div class="code-box">${participantCode}</div>
      <p><a href="${REWARD_FORM_URL}" target="_blank" style="color:var(--accent);font-weight:600;font-size:17px">▶ Open reward form / 보상 신청 폼 열기</a></p>
      <p style="margin-top:24px;color:var(--muted)">Once you've submitted the form, you may close this window.<br>
      폼 제출을 마치셨다면 이제 이 창을 닫으셔도 됩니다.</p></div>`,
    choices:[]});   // 버튼 없음 — 마지막 화면으로 유지

  // 전체를 하나의 conditional timeline으로 (자격통과 + 헤드폰통과자만)
  timeline.push({ timeline:mainTimeline, conditional_function:canProceed });

  jsPsych.run(timeline);
}

// 새로고침/이탈 경고
window.addEventListener('beforeunload',(e)=>{ if(subjectSaved && savedCount>=0){ e.preventDefault(); e.returnValue=''; } });

main().catch(e=>{ document.body.innerHTML='<p style="padding:40px;font-family:sans-serif">오류가 발생했습니다. 새로고침 해주세요.<br>An error occurred. Please refresh.<br><small>'+e.message+'</small></p>'; });
</script>
</body>
</html>
